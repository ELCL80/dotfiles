general {
    lock_cmd = pidof hyprlock || hyprlock       # aviod multiple sessons of hyprlock
    before_sleep_cmd = loginctl lock-session    # command ran before sleep, lock before sleep
    after_sleep_cmd = hyprctl dispatch dpms on  # command ran after sleep, aviod pressing keys twice to turn on display
    ignore_dbus_inhibit = false                 # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false              # whether to ignore systemd-inhibit --what=idle inhibitors
}

listener {
    timeout = 300
    on-timeout = brightnessctl -d amdgpu_bl1 s 65535
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off 
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 3600
    on-timeout = systemctl suspend
}

